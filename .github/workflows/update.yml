name: Update merged QX rules

on:
  schedule:
    # 每天 UTC 20:00（北京时间次日 04:00）自动重建
    - cron: '0 20 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/merge.ps1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 合并上游规则（remote 模式，始终拉取最新）
        shell: pwsh
        run: ./scripts/merge.ps1 -SourceMode remote -RepoRoot .

      - name: 提交变更
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output scripts/sources
          if git diff --staged --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 自动更新合并规则 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
