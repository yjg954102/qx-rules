name: Update merged QX rules

on:
  schedule:
    # 每天 UTC 22:00（北京时间次日 06:00）自动重建。
    # 必须晚于路由器的节点回推（05:30 北京）—— 否则重建时读到的是前一天的
    # 节点清单，节点分组会滞后约 22 小时。
    - cron: '0 22 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/merge.ps1'
      - 'scripts/annotate.ps1'
      - 'scripts/build-policy.py'
      - 'scripts/build-categories.py'
      - 'scripts/build-adguard-clash.py'
      - 'scripts/validate-qx.py'
      - 'scripts/fetch-moyu-full.py'
      - 'scripts/mirror-moyu-scripts.py'
      - 'scripts/merge-moyu.py'
      - 'scripts/qx-template.conf'
      # 工作流自身改动也要触发（否则修改本文件后无法自动验证）
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: update-qx-rules
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 合并上游规则（remote 模式，始终拉取最新）
        shell: pwsh
        run: ./scripts/merge.ps1 -SourceMode remote -RepoRoot .

      - name: 生成带 APP/域名注释的版本
        shell: pwsh
        run: ./scripts/annotate.ps1 -RepoRoot .

      - name: 重建分类订阅（重写/分流/墨鱼）
        run: python3 scripts/build-categories.py

      - name: 抓取墨鱼完整版（24 VIP 解锁 + 净化）并镜像脚本
        id: moyu
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/fetch-moyu-full.py
          python3 scripts/mirror-moyu-scripts.py
          python3 scripts/merge-moyu.py

      - name: 墨鱼抓取失败告警
        if: steps.moyu.outcome == 'failure'
        run: echo "::warning title=墨鱼抓取失败::ddgksf2013.top 不可达或结构变化，本次未更新墨鱼规则（其余流程继续）"

      - name: 转换 AdGuard / Clash 规则（与现有列表去重）
        id: adguard
        continue-on-error: true
        run: python3 scripts/build-adguard-clash.py

      - name: AdGuard/Clash 转换失败告警
        if: steps.adguard.outcome == 'failure'
        run: echo "::warning title=AdGuard转换失败::去重列表拉取失败，AdGuard/Clash 规则未更新（其余流程继续）"

      - name: 重建主配置（策略组 + 分流规则）
        run: |
          python3 scripts/build-policy.py \
            --template scripts/qx-template.conf \
            --out qx-integrated.conf

      - name: 校验上游是否真的拉到内容（新鲜度自检）
        run: |
          python3 - <<'PY'
          import os, re, sys

          def count(path, rx):
              if not os.path.exists(path):
                  return None
              n = 0
              for l in open(path, encoding='utf-8', errors='replace'):
                  if re.search(rx, l):
                      n += 1
              return n

          checks = [
              ('output/QX-AllInOne-Filter.conf', r'(?i)^\s*(host|domain|ip-cidr|ip6-cidr|user-agent)',
               3000, '分流规则'),
              ('output/QX-AllInOne-Rewrite.conf', r'\surl(-and-header)?\s+\S',
               300, '重写规则'),
          ]
          bad = False
          for path, rx, minimum, label in checks:
              n = count(path, rx)
              if n is None:
                  print(f'  [ERROR] {path} 不存在 —— merge.ps1 可能未产出')
                  bad = True
              elif n < minimum:
                  print(f'  [ERROR] {path} 只有 {n} 条{label}（应 >= {minimum}）—— 上游可能全部拉取失败')
                  bad = True
              else:
                  print(f'  OK  {path}  {n} 条{label}')

          # 逐源检查：scripts/sources/ 里每个上游缓存都不应为空。
          # merge.ps1 会为成功拉取的源写缓存；某源挂了日志里能看到，但整体仍可能"成功"，
          # 这里把失败源显式列出来并告警。
          src = 'scripts/sources'
          empty, missing = [], []
          if os.path.isdir(src):
              files = sorted(f for f in os.listdir(src) if os.path.isfile(os.path.join(src, f)))
              for f in files:
                  p = os.path.join(src, f)
                  if os.path.getsize(p) < 200:
                      empty.append(f)
              print(f'  OK  上游源缓存 {len(files)} 个文件')
              if empty:
                  print(f'  [WARN] {len(empty)} 个源内容异常偏小（可能拉取失败）: {", ".join(empty[:8])}')
          else:
              print('  [WARN] scripts/sources 不存在')

          # 关键产物清单
          for p in ('output/moyu-merged/moyu-app-clean.conf',
                    'output/moyu-full/moyu-vip-unlock.conf',
                    'output/per-app', 'output/filter-platform',
                    'output/rewrite-category', 'output/adguard/adguard-qx.txt'):
              exists = os.path.exists(p)
              print(f'  {"OK  " if exists else "[WARN]"} {p}')

          if bad:
              sys.exit(1)
          print('新鲜度自检通过')
          PY

      - name: 校验配置（引用完整性 / 语法 / CRLF）
        run: python3 scripts/validate-qx.py qx-integrated.conf

      - name: 提交变更
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output scripts qx-integrated.conf

          if git diff --staged --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi

          git commit -m "chore: 自动更新合并规则 $(date -u '+%Y-%m-%d %H:%M UTC')"

          # 推送：被拒时先 rebase 到远端再重试。
          # 冲突处理：输出文件是每次全量重建的产物，与远端旧版本冲突时
          # 直接 `git rebase --skip` 丢弃那个远端提交、保留我们的新产物。
          # （曾经用 --abort/reset，结果丢掉本地提交导致永远推不上去）
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi

            echo "推送被拒，rebase 到远端后重试（第 $i 次）"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "rebase 冲突：跳过远端的旧产物，保留本次重建结果"
              git rebase --skip 2>/dev/null || git rebase --abort 2>/dev/null || true
            fi
            sleep $((i * 3))
          done

          echo "::error::推送失败：已重试 5 次仍未成功"
          exit 1
